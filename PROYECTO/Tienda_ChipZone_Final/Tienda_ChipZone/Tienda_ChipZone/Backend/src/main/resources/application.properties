spring.application.name=techlab-web
server.port=8080

# CORS del frontend (Live Server)
techlab.cors.origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501

# MySQL local (XAMPP, base bd_chipzone). Se puede sobrescribir con DB_URL, DB_USER y DB_PASSWORD.
# Docker es opcional: compose.yaml expone MySQL en 3307 (ver README).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_chipzone?serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Flyway manda sobre el esquema; Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
