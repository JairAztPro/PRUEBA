spring.application.name=techlab-web
server.port=8080

# CORS del frontend (Live Server)
techlab.cors.origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501

# MySQL local (XAMPP, base bd_chipzone). Se puede sobrescribir con DB_URL, DB_USER y DB_PASSWORD.
# Docker es opcional: compose.yaml expone MySQL en 3307 (ver README).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_chipzone?serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Flyway manda sobre el esquema; Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Semana 14/15 - Spring Security con usuarios en MySQL (V4) y JWT para la API.
# Las cuentas de laboratorio se crean solo con el perfil "lab" (ver README y .env.example).
# La clave JWT (HS256, minimo 32 bytes en Base64) se obtiene SOLO del entorno y es obligatoria:
# si falta TECHLAB_JWT_SECRET_B64 la aplicacion se niega a iniciar.
app.jwt.secret-base64=${TECHLAB_JWT_SECRET_B64}
app.jwt.issuer=https://techlab.local
app.jwt.audience=techlab-api

# Cookie de sesion lista para un despliegue con HTTPS
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
