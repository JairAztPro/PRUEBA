<!doctype html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{login.titulo})}"></head>
<body class="d-flex flex-column min-vh-100">
<header th:replace="~{fragments/layout :: cabecera('login')}"></header>

<main id="contenido-principal" class="container py-5">
  <section class="login-panel mx-auto" aria-labelledby="login-title">
    <p class="text-primary fw-semibold mb-2" th:text="#{login.eyebrow}">Semana 13</p>
    <h1 id="login-title" class="h3 fw-bold" th:text="#{login.titulo}">Iniciar sesión</h1>
    <p class="text-body-secondary" th:text="#{login.intro}">Use la cuenta temporal configurada para el laboratorio.</p>

    <div class="alert alert-danger" role="alert" th:if="${param.error}" th:text="#{login.error}">
      El usuario o la contraseña no son correctos.
    </div>
    <div class="alert alert-success" role="status" th:if="${param.logout}" th:text="#{login.logout}">
      La sesión se cerró correctamente.
    </div>

    <form method="post" th:action="@{/login}" novalidate>
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="mb-3">
        <label class="form-label" for="username" th:text="#{login.usuario}">Usuario</label>
        <input class="form-control" id="username" name="username" type="text"
               autocomplete="username" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label" for="password" th:text="#{login.clave}">Contraseña</label>
        <input class="form-control" id="password" name="password" type="password"
               autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary w-100" type="submit" th:text="#{login.ingresar}">Ingresar</button>
    </form>
    <a class="d-inline-block mt-3" href="/admin/productos" th:href="@{/admin/productos}"
       th:text="#{login.volver}">Volver al catálogo público</a>
  </section>
</main>

<footer th:replace="~{fragments/layout :: pie}"></footer>
</body>
</html>
