<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChipZone | Productos desde la API</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <script src="../js/productos-api.js" defer></script>
</head>
<body>
  <main class="container py-4">
    <h1>Productos (desde el backend)</h1>
    <p>Esta página vive en <code>Frontend</code> y consulta la API de Spring Boot con <code>fetch</code>.</p>

    <form id="busqueda" class="row g-2 mb-4" role="search">
      <div class="col-md-6">
        <label for="consulta" class="form-label">Buscar por nombre o marca</label>
        <input id="consulta" type="search" maxlength="60" class="form-control">
      </div>
      <div class="col-md-3">
        <label for="categoria" class="form-label">Categoría</label>
        <select id="categoria" class="form-select">
          <option value="">Todas</option>
          <option value="gaming">Gaming</option>
          <option value="accesorios">Accesorios</option>
        </select>
      </div>
      <div class="col-md-3 d-flex align-items-end">
        <button id="buscar" type="submit" class="btn btn-primary">Buscar</button>
      </div>
    </form>

    <p id="estado" role="status" aria-live="polite"></p>
    <ul id="productos" class="list-group" aria-label="Productos disponibles"></ul>
    <noscript>Active JavaScript para consultar los productos.</noscript>
  </main>
</body>
</html>
