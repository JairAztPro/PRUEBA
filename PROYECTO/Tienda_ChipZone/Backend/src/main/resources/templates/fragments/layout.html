<!doctype html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' | ' + #{app.nombre}">ChipZone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="../static/css/panel.css" th:href="@{/css/panel.css}">
</head>
<body>

<header th:fragment="cabecera(activo)" class="border-bottom bg-body-tertiary">
  <a class="visually-hidden-focusable position-absolute p-2 bg-body" href="#contenido-principal"
    th:text="#{nav.saltar}">Saltar al contenido</a>
  <nav class="container d-flex flex-wrap align-items-center gap-3 py-3" aria-label="Navegación principal">
    <a class="navbar-brand fw-semibold me-auto" href="/admin/productos" th:href="@{/admin/productos}">
      <span th:text="#{app.nombre}">ChipZone</span>
      <small class="text-body-secondary" th:text="#{app.panel}">Panel</small>
    </a>
    <a class="link-body-emphasis text-decoration-none" href="/admin/productos"
      th:href="@{/admin/productos}" th:classappend="${activo == 'productos'} ? 'fw-bold'"
      th:attr="aria-current=${activo == 'productos'} ? 'page'" th:text="#{nav.productos}">Productos</a>
    <a class="link-body-emphasis text-decoration-none" href="/api/v1/productos"
      th:href="@{/api/v1/productos}" th:text="#{nav.api}">API JSON</a>
  </nav>
</header>

<footer th:fragment="pie" class="border-top bg-body-tertiary mt-auto">
  <div class="container py-3 small text-body-secondary" th:text="#{pie.texto}">
    ChipZone · Marcos de Desarrollo Web
  </div>
</footer>

</body>
</html>
