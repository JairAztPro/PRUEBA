spring.application.name=techlab-web
server.port=8080
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
techlab.cors.origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_tiendachipzone?serverTimezone=America/Lima&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
