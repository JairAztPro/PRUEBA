<!doctype html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TechLab | Mi Cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-body-tertiary sticky-top border-bottom">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="inicio.html">
                <i class="bi bi-cpu-fill text-accent"></i> TechLab
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="inicio.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link active" href="mi_cuenta.html">Mi cuenta</a></li>
                    <li class="nav-item"><a class="nav-link" href="#seccion-soporte">Ayuda</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <a href="mi_cuenta.html" class="nav-icon"><i class="bi bi-person"></i></a>
                    <a href="carrito.html" class="nav-icon position-relative">
                        <i class="bi bi-cart3"></i>
                        <span
                            class="badge rounded-pill bg-danger position-absolute top-0 start-100 translate-middle">2</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container py-5">

        <!-- REGISTRO -->
        <section class="mb-5" id="seccion-registro">
            <h2 class="fw-bold mb-3"><i class="bi bi-person-plus text-primary me-2"></i>Crear Cuenta</h2>
            <div class="card card-gamer p-4 border-secondary">
                <form id="formPerfil" novalidate>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="perfilNombre" class="form-label">Usuario</label>
                            <input type="text" class="form-control input-gamer" id="perfilNombre" required>
                        </div>
                        <div class="col-md-6">
                            <label for="perfilCorreo" class="form-label">Correo (Solo Gmail)</label>
                            <input type="email" class="form-control input-gamer" id="perfilCorreo" required>
                            <div class="invalid-feedback">Debe terminar estrictamente en @gmail.com</div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-acento mt-4"><i class="bi bi-person-check me-1"></i>
                        Registrarse</button>
                </form>
            </div>
        </section>

        <!-- SOPORTE / PREGUNTAS FRECUENTES -->
        <section id="seccion-soporte">
            <h2 class="fw-bold mb-3"><i class="bi bi-headset text-primary me-2"></i>Centro de Ayuda</h2>
            <div class="card card-gamer p-4 border-secondary">
                <div class="accordion accordion-flush" id="faqAccordion">
                    <div class="accordion-item bg-transparent text-white border-secondary">
                        <h3 class="accordion-header">
                            <button class="accordion-button collapsed bg-transparent text-white" type="button"
                                data-bs-toggle="collapse" data-bs-target="#faq1">
                                ¿Tienen garantía los productos?
                            </button>
                        </h3>
                        <div id="faq1" class="accordion-collapse collapse" data-bs-parent="#faqAccordion">
                            <div class="accordion-body text-secondary">Todos los productos cuentan con 12 meses de
                                garantía directa.</div>
                        </div>
                    </div>
                    <div class="accordion-item bg-transparent text-white border-secondary">
                        <h3 class="accordion-header">
                            <button class="accordion-button collapsed bg-transparent text-white" type="button"
                                data-bs-toggle="collapse" data-bs-target="#faq2">
                                ¿Tiempos de envío?
                            </button>
                        </h3>
                        <div id="faq2" class="accordion-collapse collapse" data-bs-parent="#faqAccordion">
                            <div class="accordion-body text-secondary">Lima: 24 horas. Provincias: de 48 a 72 horas
                                hábiles.</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="py-4 border-top text-center text-secondary small">
        <div class="container">
            <p class="mb-0">© <span id="anioActual"></span> TechLab. Proyecto académico.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/cuenta.js"></script>
</body>

</html>
