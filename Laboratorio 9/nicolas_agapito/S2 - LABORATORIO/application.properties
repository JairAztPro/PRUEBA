spring.application.name=techlab-web
server.port=8080

# Configuración de base de datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/techlab?serverTimezone=UTC}
spring.datasource.username=${DB_USER:techlab_app}
spring.datasource.password=${DB_PASSWORD}

# Validación del modelo con la base de datos (Flyway gestiona el esquema)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Configuración de Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true

# Endpoints de Actuator y manejo de errores
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never