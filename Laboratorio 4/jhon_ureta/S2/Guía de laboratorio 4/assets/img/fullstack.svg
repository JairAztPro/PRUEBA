<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="fullstackTitle">
  <title id="fullstackTitle">Ilustración de un flujo que conecta interfaz, servidor y base de datos</title>
  <defs>
    <linearGradient id="fsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a4fae"/>
      <stop offset="100%" stop-color="#4d2568"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#fsBg)"/>
  <rect x="48" y="120" width="150" height="110" rx="10" fill="#ffffff"/>
  <text x="123" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4d2568">UI</text>
  <rect x="245" y="120" width="150" height="110" rx="10" fill="#ffffff"/>
  <text x="320" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4d2568">API</text>
  <rect x="442" y="120" width="150" height="110" rx="10" fill="#ffffff"/>
  <text x="517" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4d2568">Datos</text>
  <path d="M198 175 L245 175" stroke="#ffffff" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M395 175 L442 175" stroke="#ffffff" stroke-width="4" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="84" y="266" width="472" height="46" rx="6" fill="#f1e6f7" stroke="#dcc2ea"/>
  <text x="106" y="294" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4d2568">Frontend + Backend integrados de punta a punta</text>
</svg>
