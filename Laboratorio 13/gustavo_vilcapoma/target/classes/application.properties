spring.datasource.url=jdbc:mysql://localhost:3306/bd_productos
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Cuenta temporal del laboratorio (Semana 13). No coloque la contraseña en Git.
app.security.demo-username=${APP_DEMO_USERNAME:docente}
app.security.demo-password=${APP_DEMO_PASSWORD}

# Cookies de sesión preparadas para un despliegue con HTTPS.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m