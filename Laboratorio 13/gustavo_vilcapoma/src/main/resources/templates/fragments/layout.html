<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="description" content="Aplicación académica TechLab Web">
 <title th:text="${titulo} + ' · TechLab Web'">TechLab Web</title>
 <link rel="stylesheet"
 href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
 <link rel="stylesheet" th:href="@{/css/site.css}" href="../static/css/site.css">
</head>
<body>
<header th:fragment="cabecera" class="border-bottom bg-white">
 <nav class="navbar navbar-expand-lg" aria-label="Navegación principal">
 <div class="container">
 <a class="navbar-brand fw-bold" th:href="@{/cursos}">TechLab Web</a>
 <div class="d-flex align-items-center gap-3">
 <a th:if="${!security.authenticated}"
 class="btn btn-outline-primary" th:href="@{/login}">
 Iniciar sesión
 </a>
 <div th:if="${security.authenticated}"
 class="d-flex align-items-center gap-3">
 <span class="small text-body-secondary">
 Sesión de <strong th:text="${security.username}">docente</strong>
 </span>
 <form method="post" th:action="@{/logout}">
 <input type="hidden"
 th:name="${_csrf.parameterName}"
 th:value="${_csrf.token}">
 <button class="btn btn-outline-secondary" type="submit">
 Cerrar sesión
 </button>
 </form>
 </div>
 </div>
 </div>
 </nav>
</header>
<footer th:fragment="pie" class="mt-auto border-top py-4">
 <div class="container text-body-secondary small">
 TechLab Web · Marcos de Desarrollo Web · 2026
 </div>
</footer>
</body>
</html>
